name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build:
    # Issue #3 adds the frontend and its npm lock file. Until then, build steps stay skipped.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build
